name: Missed secret (a secret-shaped value was not redacted)
description: A credential format ai-hooks does not catch.
labels: [missed-secret]
body:
  - type: markdown
    attributes:
      value: |
        Give a FAKE value with the same shape (same prefix, length and alphabet), or the vendor's documented example.
        Never paste a real secret. If you found a way to bypass the guard that is exploitable, use the private channel in SECURITY.md instead.
  - type: input
    id: provider
    attributes:
      label: Provider or format
    validations: {required: true}
  - type: textarea
    id: example
    attributes:
      label: Fake example with the real shape
    validations: {required: true}
  - type: textarea
    id: context
    attributes:
      label: Where it shows up (command, log line, header, file)
  - type: input
    id: version
    attributes:
      label: Output of `ai-hooks version`
